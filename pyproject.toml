[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querypilot"
version = "1.0.0"
description = "A local multi-domain natural-language-to-SQL analytics assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=1.0",
    "pandas>=2.0.0",
    "plotly>=5.24.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "sqlglot>=26.0.0",
]

[tool.setuptools]
py-modules = ["agent", "app", "config", "dataset", "main", "sql_safety", "visualization"]
